---
# Run: ansible-playbook examples/deploy_application.yml -i inventory.ini
- name: Deploy application artifact
  hosts: webservers
  become: true
  vars:
    app_dir: /opt/myapp
    repo_url: https://github.com/example/app.git
  tasks:
    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Clone or update source
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
