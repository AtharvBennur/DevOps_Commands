---
# Run: ansible-playbook examples/configure_nginx.yml -i inventory.ini
- name: Configure nginx
  hosts: webservers
  become: true
  vars:
    nginx_port: 80
    web_root: /var/www/html
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Deploy nginx config
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/default
      notify: reload nginx

  handlers:
    - name: reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
